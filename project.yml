name: Keypace
options:
  bundleIdPrefix: com.sanvith
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
packages:
  KeypaceCore:
    path: Packages/KeypaceCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
targets:
  Keypace:
    type: application
    platform: macOS
    sources: [Keypace]
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    dependencies:
      - package: KeypaceCore
    scheme:
      testTargets: [KeypaceTests]
    info:
      path: Keypace/Info.plist
      properties:
        CFBundleDisplayName: Keypace
        CFBundleShortVersionString: "0.2"
        CFBundleVersion: "2"
        LSUIElement: true
        LSMinimumSystemVersion: "15.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sanvith.keypace
        MARKETING_VERSION: "0.2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          ENABLE_HARDENED_RUNTIME: YES
  KeypaceTests:
    type: bundle.unit-test
    platform: macOS
    # Compiles the app's code directly, so tests never launch the menu-bar app.
    sources:
      - KeypaceTests
      - path: Keypace
        excludes: [KeypaceApp.swift, Info.plist, Assets.xcassets]
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    dependencies:
      - package: KeypaceCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.sanvith.keypace.tests
